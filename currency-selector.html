<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Currency Selector Prototype — Startselect</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: light;
    --font: 'Inter', system-ui, sans-serif;
    --bg: #F9FAFB;
    --surface: #FFFFFF;
    --border: #E5E7EB;
    --border-light: #F3F4F6;
    --text: #111827;
    --text-2: #6B7280;
    --text-3: #9CA3AF;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-full: 999px;
  }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px 60px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .page-header { margin-bottom: 20px; }
  .page-header h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .page-header p { font-size: 13px; color: var(--text-2); }
  .chip { display: inline-block; background: #EEF2FF; color: #3730A3; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: var(--radius-full); margin-left: 8px; vertical-align: middle; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }

  .product-hero { padding: 16px; display: flex; gap: 14px; align-items: flex-start; border-bottom: 1px solid var(--border); }
  .hero-img { width: 72px; height: 72px; border-radius: var(--radius-md); background: #E3F2FD; display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
  .hero-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
  .hero-sub { font-size: 12px; color: var(--text-2); }
  .hero-delivery { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); margin-top: 6px; }

  .section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .section-label { font-size: 11px; font-weight: 500; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

  .curr-row { display: flex; gap: 6px; }
  .curr-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 12px; border-radius: var(--radius-full);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer; font-size: 12px; font-weight: 500;
    color: var(--text); font-family: var(--font);
    transition: border-color .12s, background .12s;
    white-space: nowrap;
  }
  .curr-chip:hover:not(.unavail) { background: var(--bg); border-color: #9CA3AF; }
  .curr-chip.active { border: 1.5px solid #111827; background: var(--bg); }
  .curr-chip.unavail { opacity: 0.4; cursor: default; }
  .curr-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-green { background: #22C55E; }
  .dot-red { background: #EF4444; }
  .dot-black { background: #111827; }

  .denom-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .denom-chip {
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 11px 6px; text-align: center; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--text);
    background: var(--surface); font-family: var(--font);
    transition: border-color .12s, background .12s;
  }
  .denom-chip:hover { background: var(--bg); border-color: #9CA3AF; }
  .denom-chip.active { border: 1.5px solid #111827; background: var(--bg); }

  .qty-row { display: flex; align-items: center; }
  .qty-label { font-size: 13px; color: var(--text-2); flex: 1; }
  .qty-ctrl { display: flex; align-items: center; border: 1px solid #D1D5DB; border-radius: var(--radius-full); overflow: hidden; }
  .qty-btn { width: 32px; height: 32px; background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; font-family: var(--font); }
  .qty-btn:hover { background: var(--bg); }
  .qty-val { font-size: 14px; font-weight: 500; min-width: 24px; text-align: center; }

  .checkout-section { padding: 14px 16px 16px; }
  .buy-btn {
    width: 100%; padding: 13px; background: #111827; color: #fff;
    border: none; border-radius: var(--radius-full); font-size: 14px;
    font-weight: 500; cursor: pointer; font-family: var(--font);
    margin-bottom: 12px; transition: background .15s;
  }
  .buy-btn:hover { background: #1f2937; }
  .express-label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); margin-bottom: 10px; }
  .express-label::before, .express-label::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
  .express-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .paypal-btn { padding: 10px; background: #F5C518; border: none; border-radius: var(--radius-full); cursor: pointer; font-weight: 700; font-size: 14px; color: #003087; font-family: var(--font); }
  .applepay-btn { padding: 10px; background: #000; border: none; border-radius: var(--radius-full); cursor: pointer; font-size: 14px; color: #fff; font-family: var(--font); font-weight: 500; }
  .trust-row { display: flex; gap: 8px; }
  .trust-pill { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 11px; color: var(--text-2); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 7px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <h1>Currency Selector <span class="chip">Prototype</span></h1>
    <p>Startselect · Switch currency to see availability</p>
  </div>

  <div class="card">
    <div class="product-hero">
      <div class="hero-img">🍎</div>
      <div>
        <div class="hero-name">Apple Gift Card</div>
        <div class="hero-sub">Gift cards · United States</div>
        <div class="hero-delivery">✉️ On screen + Email</div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Product currency</div>
      <div class="curr-row" id="currRow"></div>
    </div>

    <div class="section">
      <div class="section-label">Select value</div>
      <div class="denom-grid" id="denomGrid"></div>
    </div>

    <div class="section">
      <div class="qty-row">
        <span class="qty-label">Quantity</span>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <span class="qty-val" id="qtyVal">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>
    </div>

    <div class="checkout-section">
      <button class="buy-btn" id="buyBtn">Buy now · $30</button>
      <div class="express-label">Express checkout</div>
      <div class="express-btns">
        <button class="paypal-btn">PayPal</button>
        <button class="applepay-btn"> Pay</button>
      </div>
      <div class="trust-row">
        <div class="trust-pill">⚡ Instant delivery</div>
        <div class="trust-pill">🔒 Secure payment</div>
      </div>
    </div>
  </div>
</div>

<script>
const currencies = [
  { symbol: '$', code: 'USD', available: true },
  { symbol: '€', code: 'EUR', available: true },
  { symbol: '£', code: 'GBP', available: false },
];

const denomsByCurr = {
  USD: ['$10', '$20', '$30', '$50', '$100'],
  EUR: ['€10', '€15', '€25', '€50'],
  GBP: [],
};

let selCurr = 0, selDenom = 2, qty = 1;

function renderCurr() {
  document.getElementById('currRow').innerHTML = currencies.map((c, i) => {
    const isActive = i === selCurr;
    const dotClass = isActive ? 'dot-black' : c.available ? 'dot-green' : 'dot-red';
    return `<div class="curr-chip ${isActive ? 'active' : ''} ${!c.available ? 'unavail' : ''}"
      onclick="${c.available ? `setCurr(${i})` : ''}">
      <span class="curr-dot ${dotClass}"></span>
      ${c.symbol}${c.code}
    </div>`;
  }).join('');
}

function renderDenom() {
  const code = currencies[selCurr].code;
  const denoms = denomsByCurr[code] || [];
  if (selDenom >= denoms.length) selDenom = 0;
  document.getElementById('denomGrid').innerHTML = denoms.map((d, i) =>
    `<div class="denom-chip ${i === selDenom ? 'active' : ''}" onclick="setDenom(${i})">${d}</div>`
  ).join('');
  updateBtn();
}

function updateBtn() {
  const code = currencies[selCurr].code;
  const denoms = denomsByCurr[code] || [];
  const d = denoms[selDenom] || '';
  document.getElementById('buyBtn').textContent = `Buy now · ${d}${qty > 1 ? ' × ' + qty : ''}`;
}

function setCurr(i) { selCurr = i; selDenom = 0; renderCurr(); renderDenom(); }
function setDenom(i) { selDenom = i; renderDenom(); }
function changeQty(d) {
  qty = Math.max(1, Math.min(10, qty + d));
  document.getElementById('qtyVal').textContent = qty;
  updateBtn();
}

renderCurr(); renderDenom();
</script>
</body>
</html>
