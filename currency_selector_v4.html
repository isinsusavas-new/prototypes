
<h2 class="sr-only">Product page with compact currency selector using currency symbols and color availability indicators</h2>

<style>
  .proto { font-family: var(--font-sans); max-width: 420px; margin: 0 auto; }
  .product-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; }

  .product-hero { padding: 16px; display: flex; gap: 14px; align-items: flex-start; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .hero-img { width: 72px; height: 72px; border-radius: var(--border-radius-md); background: #E3F2FD; display: flex; align-items: center; justify-content: center; font-size: 32px; flex-shrink: 0; }
  .hero-meta { flex: 1; }
  .hero-name { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 3px; }
  .hero-sub { font-size: 12px; color: var(--color-text-secondary); }
  .hero-delivery { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-secondary); margin-top: 6px; }

  .section { padding: 14px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .section-label { font-size: 11px; font-weight: 500; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

  .curr-row { display: flex; gap: 6px; }
  .curr-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 999px;
    border: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
    cursor: pointer; font-size: 12px; font-weight: 500;
    color: var(--color-text-primary);
    transition: border-color .12s, background .12s;
    white-space: nowrap;
  }
  .curr-chip:hover:not(.unavail) { background: var(--color-background-secondary); border-color: var(--color-border-secondary); }
  .curr-chip.active { border: 1.5px solid #111827; background: var(--color-background-secondary); }
  .curr-chip.unavail { opacity: 0.4; cursor: default; }
  .curr-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-green { background: #22C55E; }
  .dot-red { background: #EF4444; }
  .dot-black { background: #111827; }

  .denom-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .denom-chip {
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-md); padding: 11px 6px;
    text-align: center; cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--color-text-primary); background: var(--color-background-primary);
    transition: border-color .12s, background .12s;
  }
  .denom-chip:hover { background: var(--color-background-secondary); border-color: var(--color-border-secondary); }
  .denom-chip.active { border: 1.5px solid #111827; background: var(--color-background-secondary); }

  .qty-row { display: flex; align-items: center; gap: 12px; }
  .qty-label { font-size: 13px; color: var(--color-text-secondary); flex: 1; }
  .qty-ctrl { display: flex; align-items: center; border: 0.5px solid var(--color-border-secondary); border-radius: 999px; overflow: hidden; }
  .qty-btn { width: 32px; height: 32px; background: none; border: none; font-size: 16px; cursor: pointer; color: var(--color-text-primary); display: flex; align-items: center; justify-content: center; }
  .qty-btn:hover { background: var(--color-background-secondary); }
  .qty-val { font-size: 14px; font-weight: 500; min-width: 24px; text-align: center; color: var(--color-text-primary); }

  .checkout-section { padding: 14px 16px 16px; }
  .buy-btn { width: 100%; padding: 13px; background: #111827; color: #fff; border: none; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); margin-bottom: 12px; transition: background .15s; }
  .buy-btn:hover { background: #1f2937; }
  .express-label { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 10px; }
  .express-label::before, .express-label::after { content: ''; flex: 1; border-top: 0.5px solid var(--color-border-tertiary); }
  .express-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .paypal-btn { padding: 10px; background: #F5C518; border: none; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 14px; color: #003087; font-family: var(--font-sans); }
  .applepay-btn { padding: 10px; background: #000; border: none; border-radius: 999px; cursor: pointer; font-size: 14px; color: #fff; font-family: var(--font-sans); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .trust-row { display: flex; gap: 8px; }
  .trust-pill { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 11px; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 999px; padding: 7px 8px; }
</style>

<div class="proto">
  <div class="product-card">
    <div class="product-hero">
      <div class="hero-img">🍎</div>
      <div class="hero-meta">
        <div class="hero-name">Apple Gift Card</div>
        <div class="hero-sub">Gift cards · United States</div>
        <div class="hero-delivery">
          <i class="ti ti-mail" style="font-size:13px" aria-hidden="true"></i>
          On screen + Email
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Product currency</div>
      <div class="curr-row" id="currRow"></div>
    </div>

    <div class="section">
      <div class="section-label">Select value</div>
      <div class="denom-grid" id="denomGrid"></div>
    </div>

    <div class="section">
      <div class="qty-row">
        <span class="qty-label">Quantity</span>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <span class="qty-val" id="qtyVal">1</span>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
        </div>
      </div>
    </div>

    <div class="checkout-section">
      <button class="buy-btn" id="buyBtn">Buy now · $30</button>
      <div class="express-label">Express checkout</div>
      <div class="express-btns">
        <button class="paypal-btn">PayPal</button>
        <button class="applepay-btn"><i class="ti ti-brand-apple" style="font-size:15px" aria-hidden="true"></i> Pay</button>
      </div>
      <div class="trust-row">
        <div class="trust-pill"><i class="ti ti-bolt" style="font-size:13px" aria-hidden="true"></i> Instant delivery</div>
        <div class="trust-pill"><i class="ti ti-shield-check" style="font-size:13px" aria-hidden="true"></i> Secure payment</div>
      </div>
    </div>
  </div>
</div>

<script>
const currencies = [
  { symbol: '$', code: 'USD', available: true },
  { symbol: '€', code: 'EUR', available: true },
  { symbol: '£', code: 'GBP', available: false },
];

const denomsByCurr = {
  USD: ['$10', '$20', '$30', '$50', '$100'],
  EUR: ['€10', '€15', '€25', '€50'],
  GBP: [],
};

let selCurr = 0, selDenom = 2, qty = 1;

function renderCurr() {
  document.getElementById('currRow').innerHTML = currencies.map((c, i) => {
    const isActive = i === selCurr;
    const dotClass = isActive ? 'dot-black' : c.available ? 'dot-green' : 'dot-red';
    return `<div class="curr-chip ${isActive ? 'active' : ''} ${!c.available ? 'unavail' : ''}"
      onclick="${c.available ? `setCurr(${i})` : ''}">
      <span class="curr-dot ${dotClass}"></span>
      ${c.symbol}${c.code}
    </div>`;
  }).join('');
}

function renderDenom() {
  const code = currencies[selCurr].code;
  const denoms = denomsByCurr[code] || [];
  if (selDenom >= denoms.length) selDenom = 0;
  document.getElementById('denomGrid').innerHTML = denoms.map((d, i) =>
    `<div class="denom-chip ${i === selDenom ? 'active' : ''}" onclick="setDenom(${i})">${d}</div>`
  ).join('');
  updateBtn();
}

function updateBtn() {
  const code = currencies[selCurr].code;
  const denoms = denomsByCurr[code] || [];
  const d = denoms[selDenom] || '';
  document.getElementById('buyBtn').textContent = `Buy now · ${d}${qty > 1 ? ' × ' + qty : ''}`;
}

function setCurr(i) { selCurr = i; selDenom = 0; renderCurr(); renderDenom(); }
function setDenom(i) { selDenom = i; renderDenom(); }
function changeQty(d) {
  qty = Math.max(1, Math.min(10, qty + d));
  document.getElementById('qtyVal').textContent = qty;
  updateBtn();
}

renderCurr(); renderDenom();
</script>
